<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="History Demystified">
  <!--
    An illuminated initial: a gold capital on lapis, inside a ruled border.
    It is what a manuscript does to open a page, so it says "history" through
    the same idiom as the rest of the design rather than by illustrating a
    scroll or an hourglass — both of which turn to mush at 16 pixels.
    Drawn as rectangles rather than text so it never depends on a font.
  -->
  <rect width="32" height="32" rx="7" fill="#22437f"/>
  <rect x="3.25" y="3.25" width="25.5" height="25.5" rx="4.5"
        fill="none" stroke="#c08f1c" stroke-width="1.4" opacity="0.85"/>
  <g fill="#e6bb5c">
    <rect x="10" y="9.5" width="3.6" height="13" rx="0.6"/>
    <rect x="18.4" y="9.5" width="3.6" height="13" rx="0.6"/>
    <rect x="10" y="14.2" width="12" height="3.6" rx="0.6"/>
  </g>
</svg>
